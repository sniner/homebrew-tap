name: Update formulae

# Once a day, check each formula's project for a newer release and update
# the formula. The projects do not know about this tap; this workflow is
# the only place that follows their releases.
#
# A formula that cannot be updated does not hold back the others: they
# are checked and committed, and the run fails at the end.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update formulae to the latest releases
    runs-on: ubuntu-latest
    outputs:
      updates: ${{ steps.update.outputs.updates }}
      outcome: ${{ steps.update.outcome }}
    steps:
      - uses: actions/checkout@v7

      - name: Update every formula whose project has a newer release
        id: update
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-formula.py

      - name: Upload the updated formulae
        if: steps.update.outputs.updates != ''
        uses: actions/upload-artifact@v7
        with:
          name: formulae
          path: Formula/
          retention-days: 1

  check:
    name: Check the updated formulae on ${{ matrix.os }}
    needs: update
    if: needs.update.outputs.updates != ''
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: formulae
          path: Formula

      - name: Audit, install and test the updated formulae
        env:
          UPDATES: ${{ needs.update.outputs.updates }}
        run: |
          names=()
          while read -r name _; do
              names+=("${name}")
          done <<< "${UPDATES}"
          scripts/check.sh "${names[@]}"

  commit:
    name: Commit and push
    needs: [update, check]
    if: always() && needs.update.result == 'success' && needs.check.result != 'failure' && needs.check.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - if: needs.update.outputs.updates != ''
        uses: actions/download-artifact@v8
        with:
          name: formulae
          path: Formula

      - name: Commit each updated formula and push
        if: needs.update.outputs.updates != ''
        env:
          UPDATES: ${{ needs.update.outputs.updates }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r name old arrow new; do
              git add "Formula/${name}.rb"
              git commit -m "Update ${name} ${old} ${arrow} ${new}"
          done <<< "${UPDATES}"
          git push

      - name: Fail the run if a formula could not be updated
        if: needs.update.outputs.outcome == 'failure'
        run: |
          echo "::error::Some formulae could not be updated, see the log of the update job"
          exit 1
