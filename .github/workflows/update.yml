name: Update formulae

# Once a day, ask each packaged project for its newest release and bring
# its formula along. The projects know nothing of this tap; this is the
# only place that watches them.

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    name: Bring formulae to the latest releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Rewrite formulae behind their project's release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/update-formula.py ossuary sniner/ossuary

      - name: Audit, install and test what changed
        if: steps.update.outputs.summary != ''
        run: scripts/check.sh

      - name: Commit and push
        if: steps.update.outputs.summary != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "Update ${{ steps.update.outputs.summary }}"
          git push
